name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FILC_VERSION: "0.686"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare cache directory
        run: mkdir -p "$RUNNER_TEMP/filc-cache"

      - name: Restore Fil-C archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/filc-cache/filc-${{ env.FILC_VERSION }}.tar.xz
          key: filc-${{ env.FILC_VERSION }}-${{ runner.os }}

      - name: Download Fil-C pizfix
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/filc-cache/filc-${FILC_VERSION}.tar.xz"
          if [ ! -f "$archive" ]; then
            curl -fL --retry 3 -o "$archive" \
              "https://github.com/pizlonator/fil-c/releases/download/v${FILC_VERSION}/filc-${FILC_VERSION}-linux-x86_64.tar.xz"
          fi
          mkdir -p "$RUNNER_TEMP/filc"
          tar -C "$RUNNER_TEMP/filc" -xf "$archive"

      - name: Add Fil-C to PATH
        run: |
          echo "$RUNNER_TEMP/filc/filc-${FILC_VERSION}-linux-x86_64/build/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: bash tests/run-tests.sh --verbose

      - name: Run ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -s bash setup.sh .bash_aliases tests/run-tests.sh
